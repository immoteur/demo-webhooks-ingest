components:
    schemas:
        Classified:
            type: object
            required:
                - id
                - propertyId
                - currency
                - status
                - meta
                - property
                - source
                - squareUnit
                - publisher
                - transaction
                - location
            properties:
                contact:
                    description: Contact information for the classified.
                    $ref: "#/components/schemas/ClassifiedContact"
                currency:
                    description: Currency of the price.
                    $ref: "#/components/schemas/ClassifiedCurrency"
                description:
                    description: Description of the classified.
                    type: string
                    example: Bel appartement lumineux au cœur de Paris.
                energy:
                    description: Energy information for the classified.
                    $ref: "#/components/schemas/Energy"
                id:
                    description: Unique identifier for the classified.
                    type: string
                    format: uuid
                    example: 7f6e3b4d-9c22-46a0-8f20-0d1a2b3c4d5e
                location:
                    description: Location information for the classified.
                    $ref: "#/components/schemas/Location"
                media:
                    description: Media information for the classified.
                    $ref: "#/components/schemas/Media"
                meta:
                    description: Meta information for the classified.
                    $ref: "#/components/schemas/ClassifiedMeta"
                property:
                    description: Property information for the classified.
                    $ref: "#/components/schemas/PropertyAttributes"
                propertyId:
                    description: Identifier of the property linked to this classified.
                    type: string
                    format: uuid
                    example: 01920347-45c7-7b81-a2e4-d28c43f0d123
                publishedAt:
                    description: Timestamp when the classified was published on its original source.
                    type: string
                    format: date-time
                    nullable: true
                    example: "2025-05-15T08:10:00Z"
                publisher:
                    description: Publisher information for the classified.
                    $ref: "#/components/schemas/ClassifiedPublisher"
                source:
                    description: Source information for the classified.
                    $ref: "#/components/schemas/ClassifiedSource"
                squareUnit:
                    description: Square unit of the price.
                    $ref: "#/components/schemas/ClassifiedSquareUnit"
                status:
                    description: Current lifecycle status of the classified.
                    $ref: "#/components/schemas/ClassifiedStatus"
                title:
                    description: Title of the classified.
                    type: string
                    example: Appartement 3 pièces Paris 1er
                transaction:
                    description: Transaction information for the classified.
                    $ref: "#/components/schemas/Transaction"
        ClassifiedContact:
            type: object
            properties:
                email:
                    description: Email address of the contact.
                    type: string
                    format: email
                    example: proprietaire@example.org
                name:
                    description: Name of the contact.
                    type: string
                    example: Jean Dupont
                phone:
                    description: Phone number of the contact (E.164 recommended).
                    type: string
                    format: phone
                    pattern: '^\+?[1-9]\d{1,14}$'
                    example: "+33612345678"
        ClassifiedCurrency:
            type: string
            enum:
                - euro
        ClassifiedMeta:
            type: object
            required:
                - firstSeenAt
                - lastModifiedAt
                - lastSeenAt
            properties:
                firstSeenAt:
                    description: Timestamp when the classified was first seen.
                    type: string
                    format: date-time
                    example: "2025-09-15T08:10:00Z"
                lastModifiedAt:
                    description: Timestamp when the classified was last modified.
                    type: string
                    format: date-time
                    example: "2025-09-15T09:00:00Z"
                lastSeenAt:
                    description: Timestamp when the classified was last seen.
                    type: string
                    format: date-time
                    example: "2025-09-15T09:00:00Z"
                removedAt:
                    description: Timestamp when the classified was removed.
                    type: string
                    format: date-time
                    nullable: true
                    example: "2025-09-20T12:00:00Z"
        ClassifiedPublisher:
            type: object
            required:
                - isProfessional
            properties:
                email:
                    description: Email address of the publisher (if professional).
                    type: string
                    format: email
                    example: contact@agence-paris.fr
                feesUrl:
                    description: URL to the fee information of the publisher (if professional).
                    type: string
                    format: uri
                    example: https://www.agence-paris.fr/honoraires
                isProfessional:
                    description: Indicates if the publisher is a professional.
                    type: boolean
                    example: true
                phone:
                    description: Phone number of the publisher (if professional).
                    type: string
                    format: phone
                    pattern: '^\+?[1-9]\d{1,14}$'
                    example: "+33123456789"
                siren:
                    description: SIREN number of the publisher (if professional).
                    type: string
                    example: "123456789"
                siret:
                    description: SIRET number of the publisher (if professional).
                    type: string
                    example: "12345678900011"
                type:
                    description: Type of publisher (if professional).
                    type: string
                    enum:
                        - agency
                        - mandatary
                    example: agency
        ClassifiedSource:
            type: object
            required:
                - domain
                - url
            properties:
                domain:
                    description: Domain of the source.
                    type: string
                    example: seloger.com
                url:
                    description: URL of the source.
                    type: string
                    format: uri
                    example: https://www.seloger.com/annonces/achat/appartement/paris-1er-75/5-pieces/0.htm
        ClassifiedSquareUnit:
            type: string
            enum:
                - squareMeter
        ClassifiedStatus:
            description: Lifecycle status details of the classified.
            type: object
            required:
                - current
            properties:
                current:
                    description: Current lifecycle status of the classified.
                    $ref: "#/components/schemas/ClassifiedStatusValue"
        ClassifiedStatusValue:
            description: Supported lifecycle statuses for classifieds.
            type: string
            enum:
                - available
                - removed
                - rented
                - sold
                - underOffer
        DataAccessLimit:
            description: Inner filters applied to your search, see `https://immoteur.com/en/dashboard/billing`
            type: object
            required:
                - departments
                - sirens
                - sirets
            properties:
                departments:
                    type: array
                    description: Departments implicitly whitelisted for this account.
                    items:
                        type: string
                    example: ["75", "92"]
                sirens:
                    type: array
                    description: SIREN identifiers implicitly whitelisted for this account.
                    items:
                        type: string
                    example: ["123456789"]
                sirets:
                    type: array
                    description: SIRET identifiers implicitly whitelisted for this account.
                    items:
                        type: string
                    example: ["12345678900011"]
        Energy:
            type: object
            properties:
                dpe:
                    description: DPE energy information.
                    $ref: "#/components/schemas/EnergyDpe"
                ges:
                    description: GES energy information.
                    $ref: "#/components/schemas/EnergyGes"
                heating:
                    description: Heating energy information.
                    $ref: "#/components/schemas/EnergyHeating"
        EnergyDpe:
            type: object
            properties:
                date:
                    type: string
                    format: date
                    example: "2023-05-10"
                label:
                    $ref: "#/components/schemas/EnergyDpeLabel"
                value:
                    type: integer
                    example: 180
        EnergyDpeLabel:
            type: string
            enum:
                - a
                - b
                - c
                - d
                - e
                - f
                - g
        EnergyGes:
            type: object
            properties:
                date:
                    type: string
                    format: date
                    example: "2023-05-10"
                label:
                    $ref: "#/components/schemas/EnergyGesLabel"
                value:
                    type: integer
                    example: 45
        EnergyGesLabel:
            type: string
            enum:
                - a
                - b
                - c
                - d
                - e
                - f
                - g
        ClassifiedsExport:
            type: object
            required:
                - exportId
                - items
            properties:
                exportId:
                    type: string
                    format: uuid
                    description: Export identifier for correlating chunks.
                items:
                    type: array
                    description: Collection of classifieds included in this webhook call.
                    items:
                        $ref: "#/components/schemas/Classified"
        EnergyHeating:
            type: object
            properties:
                source:
                    description: Source of heating energy.
                    type: string
                    enum:
                        - aerothermal
                        - biomass
                        - coal
                        - electricity
                        - fuel
                        - gas
                        - geothermal
                        - pellet
                        - solar
                        - wood
                    example: gas
                system:
                    description: Heating system type.
                    type: string
                    enum:
                        - fireplace
                        - floor
                        - radiator
                        - reversibleAirConditioning
                        - stove
                    example: radiator
                type:
                    description: Type of heating system.
                    type: string
                    enum:
                        - city
                        - individual
                        - mixed
                        - shared
                    example: individual
        Location:
            type: object
            required:
                - city
                - country
                - department
                - postcode
            properties:
                city:
                    description: City of the property.
                    $ref: "#/components/schemas/LocationCity"
                country:
                    description: Country of the property.
                    type: string
                    enum:
                        - france
                    example: france
                department:
                    type: string
                    description: French department code (e.g., "75").
                    example: "75"
                latitude:
                    description: Latitude of the property.
                    type: number
                    format: double
                    minimum: -90
                    maximum: 90
                    example: 48.8606
                longitude:
                    description: Longitude of the property.
                    type: number
                    format: double
                    minimum: -180
                    maximum: 180
                    example: 2.3376
                postcode:
                    description: Postcode of the property.
                    type: string
                    example: "75001"
        LocationCity:
            type: object
            required:
                - name
                - inseeCode
            properties:
                inseeCode:
                    description: INSEE code of the city.
                    type: string
                    example: "75056"
                name:
                    description: Name of the city.
                    type: string
                    example: Paris
        LocationGeoBbox:
            type: object
            description: Bounding box filter built from south-west and north-east corners in EPSG:4326.
            additionalProperties: false
            required:
                - sw
                - ne
            properties:
                ne:
                    $ref: "#/components/schemas/LocationLatLng"
                sw:
                    $ref: "#/components/schemas/LocationLatLng"
        LocationGeoCircle:
            type: object
            description: Circular geo filter defined by a center and radius in meters.
            additionalProperties: false
            required:
                - center
                - radiusMeters
            properties:
                center:
                    $ref: "#/components/schemas/LocationLatLng"
                radiusMeters:
                    type: integer
                    minimum: 10
                    maximum: 50000
                    description: Radius in meters (10m to 50km) for the geo circle filter.
                    example: 1500
        LocationLatLng:
            type: object
            additionalProperties: false
            required:
                - lat
                - lng
            properties:
                lat:
                    type: number
                    format: double
                    minimum: -90
                    maximum: 90
                    description: Latitude in decimal degrees, WGS-84.
                    example: 48.8566
                lng:
                    type: number
                    format: double
                    minimum: -180
                    maximum: 180
                    description: Longitude in decimal degrees, WGS-84.
                    example: 2.3522
        Media:
            type: object
            required:
                - images
            properties:
                images:
                    description: Images of the classified.
                    type: array
                    items:
                        $ref: "#/components/schemas/MediaImage"
                    example:
                        - id: cb6cbd86-5d14-48bd-a566-613e9dfc91d0
                          position: 1
                          url: https://images.immoteur.com/sample/apt-paris-1.jpg
        MediaImage:
            type: object
            required:
                - id
                - position
                - url
            properties:
                averageHash:
                    description: Average hash (aHash) bitstring of the image.
                    type: string
                    example: "1111000011110000111100001111000011110000111100001111000011110000"
                differenceHash:
                    description: Difference hash (dHash) bitstring of the image.
                    type: string
                    example: "0101010100101010010101001010100101010010101001010100101010010101"
                id:
                    description: Identifier of the image.
                    type: string
                    format: uuid
                    example: cb6cbd86-5d14-48bd-a566-613e9dfc91d0
                perceptualHash:
                    description: Perceptual hash (pHash) bitstring of the image.
                    type: string
                    example: "1010101001010100101010010101001010100101010010101010010101010010"
                position:
                    description: Order of the image in the gallery.
                    type: integer
                    example: 1
                url:
                    description: URL of the image.
                    type: string
                    format: uri
                    example: https://images.immoteur.com/sample/apt-paris-1.jpg
        Property:
            type: object
            required:
                - classifieds
                - description
                - id
                - location
                - meta
                - property
                - status
                - transaction
            properties:
                classifieds:
                    description: Classifieds currently associated with the property.
                    type: array
                    items:
                        $ref: "#/components/schemas/PropertyClassified"
                description:
                    description: Description of the property.
                    type: string
                    nullable: true
                energy:
                    description: Energy information aggregated from the property's classifieds.
                    $ref: "#/components/schemas/Energy"
                id:
                    description: Unique identifier for the property.
                    type: string
                    format: uuid
                    example: 11111111-2222-3333-4444-555555555555
                location:
                    description: Location information for the property.
                    $ref: "#/components/schemas/Location"
                media:
                    description: Media information aggregated from classifieds.
                    $ref: "#/components/schemas/Media"
                meta:
                    $ref: "#/components/schemas/PropertyMeta"
                property:
                    description: Property information aggregated from classifieds.
                    $ref: "#/components/schemas/PropertyAttributes"
                status:
                    description: Current lifecycle status of the property, aggregated from classifieds.
                    $ref: "#/components/schemas/ClassifiedStatus"
                transaction:
                    description: Transaction information for the property.
                    $ref: "#/components/schemas/Transaction"
        PropertyAttributes:
            type: object
            required:
                - type
            properties:
                airConditioningExists:
                    description: Indicates if the property has air conditioning.
                    type: boolean
                    example: false
                alarmExists:
                    description: Indicates if the property has an alarm system.
                    type: boolean
                    example: false
                area:
                    description: Area of the property.
                    type: number
                    format: float
                    minimum: 0
                    example: 50
                atticExists:
                    description: Indicates if the property has an attic.
                    type: boolean
                    example: false
                balconyArea:
                    description: Area of the balcony.
                    type: number
                    format: float
                    minimum: 0
                    example: 6
                balconyCount:
                    description: Number of balconies.
                    type: integer
                    minimum: 0
                    example: 1
                balconyExists:
                    description: Indicates if the property has a balcony.
                    type: boolean
                    example: false
                bathroomCount:
                    description: Number of bathrooms.
                    type: integer
                    minimum: 0
                    example: 1
                bedroomCount:
                    description: Number of bedrooms in the property.
                    type: integer
                    minimum: 0
                    example: 2
                caretakerExists:
                    description: Indicates if the property has a caretaker.
                    type: boolean
                    example: false
                cellarExists:
                    description: Indicates if the property has a cellar.
                    type: boolean
                    example: false
                constructionYear:
                    description: Year of construction for the property.
                    type: integer
                    minimum: 0
                    example: 1975
                doorCodeExists:
                    description: Indicates if the property has a door code.
                    type: boolean
                    example: true
                elevatorExists:
                    description: Indicates if the property has an elevator.
                    type: boolean
                    example: true
                fireplaceExists:
                    description: Indicates if the property has a fireplace.
                    type: boolean
                    example: false
                floor:
                    description: Floor of the property (Apartment only).
                    type: integer
                    minimum: 0
                    example: 3
                floorCount:
                    description: Total number of floors in the property (Apartment only).
                    type: integer
                    minimum: 0
                    example: 6
                garageExists:
                    description: Indicates if the property has a garage.
                    type: boolean
                    example: false
                gardenExists:
                    description: Indicates if the property has a garden.
                    type: boolean
                    example: false
                intercomExists:
                    description: Indicates if the property has an intercom.
                    type: boolean
                    example: true
                isCondominium:
                    description: Indicates if the property is part of a condominium.
                    type: boolean
                    example: true
                isDisabledFriendly:
                    description: Indicates if the property is disabled friendly.
                    type: boolean
                    example: false
                isDualAspect:
                    description: Indicates if the property has dual aspect.
                    type: boolean
                    example: false
                isNew:
                    description: Indicates if the property is new.
                    type: boolean
                    example: false
                isOccupied:
                    description: Indicates if the property is occupied.
                    type: boolean
                    example: false
                landArea:
                    description: Land area of the property (including house, garden, terrace, entrance, etc.).
                    type: number
                    format: float
                    minimum: 0
                    example: 0
                livingRoomArea:
                    description: Area of the living room.
                    type: number
                    format: float
                    minimum: 0
                    example: 20
                orientation:
                    description: Orientation of the property.
                    type: string
                    enum:
                        - east
                        - north
                        - northEast
                        - northWest
                        - south
                        - southEast
                        - southWest
                        - west
                    example: south
                parkingExists:
                    description: Indicates if the property has parking.
                    type: boolean
                    example: true
                renovationIsNeeded:
                    description: Indicates if renovation is needed.
                    type: boolean
                    example: false
                renovationYear:
                    description: Year of renovation for the property.
                    type: integer
                    minimum: 0
                    example: 2018
                roomCount:
                    description: Number of rooms in the property.
                    type: integer
                    minimum: 0
                    example: 3
                showerRoomCount:
                    description: Number of shower rooms in the property.
                    type: integer
                    minimum: 0
                    example: 1
                swimmingPoolExists:
                    description: Indicates if the property has a swimming pool.
                    type: boolean
                    example: false
                terraceArea:
                    description: Area of the terrace.
                    type: number
                    format: float
                    minimum: 0
                    example: 8
                terraceCount:
                    description: Number of terraces.
                    type: integer
                    minimum: 0
                    example: 1
                terraceExists:
                    description: Indicates if the property has a terrace.
                    type: boolean
                    example: true
                toiletCount:
                    description: Number of toilets.
                    type: integer
                    minimum: 0
                    example: 1
                toiletSeparateExists:
                    description: Indicates if the property has a separate toilet.
                    type: boolean
                    example: true
                type:
                    description: Type of property.
                    $ref: "#/components/schemas/PropertyType"
        PropertyClassified:
            type: object
            required:
                - id
                - publisher
                - source
                - status
                - transaction
            properties:
                description:
                    description: Description of the classified.
                    type: string
                    nullable: true
                    example: Appartement lumineux avec terrasse et vue dégagée.
                id:
                    description: Unique identifier of the classified.
                    type: string
                    format: uuid
                    example: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
                publisher:
                    description: Publisher information for the classified.
                    $ref: "#/components/schemas/ClassifiedPublisher"
                source:
                    description: Source information for the classified.
                    $ref: "#/components/schemas/ClassifiedSource"
                status:
                    description: Current lifecycle status of the classified.
                    $ref: "#/components/schemas/ClassifiedStatus"
                transaction:
                    description: Transaction information for the classified.
                    $ref: "#/components/schemas/TransactionPrice"
        PropertyMeta:
            type: object
            required:
                - firstSeenAt
                - lastSeenAt
            properties:
                firstSeenAt:
                    description: Timestamp when the property was first seen.
                    type: string
                    format: date-time
                    example: "2025-05-10T08:00:00Z"
                lastSeenAt:
                    description: Timestamp when the property was last seen.
                    type: string
                    format: date-time
                    example: "2025-06-20T11:00:00Z"
        PropertySearchOrder:
            type: string
            description: Direction applied to `sortBy`. Defaults to `desc`.
            default: desc
            enum:
                - asc
                - desc
        PropertySearchSortBy:
            type: string
            description: |-
                Field used to sort results. Set `orderBy` to switch between ascending or descending order. Defaults to `firstSeenAt` with `desc`.
            default: firstSeenAt
            enum:
                - firstSeenAt
                - lastSeenAt
                - lastUpdatedAt
                - price
                - priceChangeDate
                - pricePerSquareMeter
                - relevance
        PropertyType:
            description: |-
                *   **House**: Residential building sold as an entire unit (e.g., a single-family home, villa, or full residence).
                *   **Apartment**: A single residential unit within a larger building.
                *   **Program**: Refers to new-build or off-plan property developments.
                *   **Shop**: Commercial property with public access, such as boutiques, barbers, or butcher shops.
                *   **Premises**: Non-residential units like cellars, attics, or general storage/local spaces.
                *   **Office**: Properties intended for professional work environments.
                *   **Land**: Plots of terrain, undeveloped or partially developed.
                *   **Building**: An entire non-residential building sold as a unit, such as a hotel or hangar.
                *   **Parking**: Spaces or boxes designed for vehicle storage.
            type: string
            enum:
                - apartment
                - building
                - house
                - land
                - office
                - other
                - parking
                - premises
                - program
                - shop
        SubscriptionPlan:
            type: string
            description: Active plan that governs rate limits and pagination caps for this token.
            enum:
                - enterprise500
                - free
                - growth100
                - pro200
                - starter30
            example: pro200
        Transaction:
            type: object
            required:
                - price
                - type
            properties:
                price:
                    description: Price information for the transaction.
                    $ref: "#/components/schemas/TransactionPrice"
                type:
                    description: Type of transaction.
                    $ref: "#/components/schemas/TransactionType"
        TransactionPrice:
            type: object
            required:
                - current
                - initial
                - history
            properties:
                current:
                    description: Current price of the transaction.
                    type: integer
                    minimum: 0
                    example: 650000
                history:
                    description: Historical price records observed for the transaction.
                    type: array
                    items:
                        $ref: "#/components/schemas/TransactionPriceHistoryEntry"
                initial:
                    description: Initial price observed for the transaction.
                    type: integer
                    minimum: 0
                    example: 680000
                perSquareUnit:
                    description: Price per square unit (only for sale).
                    type: integer
                    minimum: 0
                    example: 12500
        TransactionPriceHistoryEntry:
            type: object
            required:
                - id
                - timestamp
                - value
            properties:
                id:
                    description: Stable unique identifier for the price history entry.
                    type: string
                    format: uuid
                    example: "0aa4bc4b-7db0-4bf2-9a4a-f2e6f8d4f99a"
                timestamp:
                    description: Timestamp when the price was recorded.
                    type: string
                    format: date-time
                    example: "2025-09-10T08:10:00Z"
                value:
                    description: Price recorded at the given timestamp.
                    type: integer
                    minimum: 0
                    example: 650000
        TransactionType:
            type: string
            enum:
                - rent
                - sale
    responses:
        DefaultError:
            description: Undocumented error
        BadRequestError:
            description: Bad request — the request could not be understood or was missing required information.
        UnauthorizedError:
            description: Authentication required / invalid token
            content:
                application/json:
                    schema:
                        type: object
                        required:
                            - message
                        properties:
                            message:
                                type: string
                    example:
                        message: "Unauthenticated."
        ForbiddenError:
            description: Authenticated but not allowed for this resource
        RateLimitError:
            description: Too many requests
        ValidationError:
            description: Validation error response
            content:
                application/json:
                    schema:
                        type: object
                        required:
                            - errors
                        properties:
                            errors:
                                type: object
                                additionalProperties:
                                    type: array
                                    items:
                                        type: string
                    example:
                        errors:
                            transactionType:
                                - "The selected transactionType is invalid."
                            page:
                                - "The page must be at least 1."
        NotFoundError:
            description: Resource not found
        MissConfigurationError:
            description: Data access (SIREN / SIRET / Department) not configured for example.
            content:
                application/json:
                    schema:
                        type: object
                        required:
                            - message
                        properties:
                            configurationUrl:
                                type: string
                                format: uri
                                example: https://immoteur.com/en/dashboard/billing#data-access
                            documentationUrl:
                                type: string
                                format: uri
                                example: https://docs.immoteur.com/pages/en/introduction
                            message:
                                type: string
                                example: Data access (SIREN / SIRET / Department) not configured.
    securitySchemes:
        BearerAuth:
            type: http
            scheme: bearer
            bearerFormat: Personal Access Token
            description: |-
                Send your Immoteur Personal Access Token in the `Authorization` header:
                `Authorization: Bearer <token>`

                You can create and manage your Personal Access Tokens here:
                https://immoteur.com/dashboard/settings
                                            status:
                                                current: available
