    /properties/search:
        post:
            summary: Search properties with filters
            description: Returns a paginated list of properties based on searchable fields
            operationId: propertySearch
            tags:
                - Property
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - page
                                - transactionType
                                - propertyTypes
                            properties:
                                energyDpeLabels:
                                    type: array
                                    description: Filter results to properties whose DPE label matches one of the provided letters.
                                    items:
                                        $ref: "#/components/schemas/EnergyDpeLabel"
                                    example: ["a", "b"]
                                energyGesLabels:
                                    type: array
                                    description: Filter results to properties whose greenhouse-gas (GES) label matches one of the provided letters.
                                    items:
                                        $ref: "#/components/schemas/EnergyGesLabel"
                                    example: ["a", "b"]
                                locationDepartments:
                                    type: array
                                    items:
                                        type: string
                                    description: List of French department codes (e.g., "75" for Paris).
                                    example: ["75", "92"]
                                locationGeoBbox:
                                    $ref: "#/components/schemas/LocationGeoBbox"
                                locationGeoCircle:
                                    $ref: "#/components/schemas/LocationGeoCircle"
                                locationInseeCodes:
                                    type: array
                                    items:
                                        type: string
                                    description: List of INSEE city codes.
                                    example: ["75056", "92050"]
                                locationPostcodes:
                                    type: array
                                    items:
                                        type: string
                                    description: List of French postcodes.
                                    example: ["75001", "92000"]
                                orderBy:
                                    $ref: "#/components/schemas/PropertySearchOrder"
                                page:
                                    type: integer
                                    minimum: 1
                                    maximum: 500
                                    default: 1
                                    description: 1-based page index.
                                    example: 1
                                propertyAreaMax:
                                    type: integer
                                    description: Maximum property area (m²).
                                    example: 100
                                propertyAreaMin:
                                    type: integer
                                    description: Minimum property area (m²).
                                    example: 40
                                propertyBalconyExists:
                                    type: boolean
                                    description: Filter results to properties that have a balcony.
                                    example: true
                                propertyBedroomCountMin:
                                    type: integer
                                    minimum: 0
                                    description: Minimum number of bedrooms.
                                    example: 2
                                propertyCellarExists:
                                    type: boolean
                                    description: Filter results to properties that have a cellar.
                                    example: false
                                propertyElevatorExists:
                                    type: boolean
                                    description: Filter results to properties that have an elevator.
                                    example: true
                                propertyGarageExists:
                                    type: boolean
                                    description: Filter results to properties that have a garage.
                                    example: false
                                propertyGardenExists:
                                    type: boolean
                                    description: Filter results to properties that have a garden.
                                    example: false
                                propertyIsProgram:
                                    type: boolean
                                    description: Limit to new-build/off-plan programs.
                                    example: false
                                propertyParkingExists:
                                    type: boolean
                                    description: Filter results to properties that have parking.
                                    example: true
                                propertyRoomCountMin:
                                    type: integer
                                    minimum: 0
                                    description: Minimum total room count.
                                    example: 3
                                propertySwimmingPoolExists:
                                    type: boolean
                                    description: Filter results to properties that have a swimming pool.
                                    example: false
                                propertyTerraceExists:
                                    type: boolean
                                    description: Filter results to properties that have a terrace.
                                    example: true
                                propertyTypes:
                                    type: array
                                    items:
                                        $ref: "#/components/schemas/PropertyType"
                                    description: One or more property types to include.
                                    example: ["apartment", "house"]
                                searchQuery:
                                    type: string
                                    maxLength: 400
                                    description: Optional full-text query. When omitted, an empty query is used.
                                    example: "terrasse ascenseur"
                                searchThreshold:
                                    type: number
                                    format: float
                                    minimum: 0
                                    maximum: 1
                                    default: 0.2
                                    description: Minimum relevance score required for a hit to be kept.
                                    example: 0.2
                                sortBy:
                                    $ref: "#/components/schemas/PropertySearchSortBy"
                                sourceDomains:
                                    type: array
                                    items:
                                        type: string
                                    description: Limit results to classifieds originating from the provided domains.
                                    example: ["bienici.com", "orpi.com"]
                                sourceDomainsCountMax:
                                    type: integer
                                    description: Maximum number of distinct source domains attached to each property.
                                    example: 3
                                sourceDomainsCountMin:
                                    type: integer
                                    description: Minimum number of distinct source domains attached to each property.
                                    example: 1
                                transactionPriceHasChanged:
                                    type: boolean
                                    description: Only properties whose price has changed recently.
                                    example: false
                                transactionPriceMax:
                                    type: integer
                                    description: Maximum current price.
                                    example: 1000000
                                transactionPriceMin:
                                    type: integer
                                    description: Minimum current price.
                                    example: 200000
                                transactionType:
                                    $ref: "#/components/schemas/TransactionType"
                        example:
                            page: 1
                            transactionType: sale
                            propertyTypes: ["apartment", "house"]
                            searchQuery: "terrasse ascenseur"
                            searchThreshold: 0.2
                            locationDepartments: ["75", "92"]
                            locationInseeCodes: ["75056", "92050"]
                            locationPostcodes: ["75001", "92000"]
                            locationGeoBbox:
                                sw:
                                    lat: 48.8156
                                    lng: 2.2241
                                ne:
                                    lat: 48.9021
                                    lng: 2.4699
                            locationGeoCircle:
                                center:
                                    lat: 48.8566
                                    lng: 2.3522
                                radiusMeters: 5000
                            transactionPriceMin: 200000
                            transactionPriceMax: 1000000
                            propertyBedroomCountMin: 2
                            propertyAreaMin: 40
                            propertyElevatorExists: true
                            propertyTerraceExists: true
                            propertyParkingExists: true
                            sourceDomains: ["bienici.com", "orpi.com"]
                            sourceDomainsCountMin: 1
                            sourceDomainsCountMax: 3
            responses:
                "200":
                    description: List of properties matching the filters
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - items
                                    - meta
                                properties:
                                    items:
                                        type: array
                                        items:
                                            type: object
                                            required:
                                                - classifieds
                                                - id
                                                - property
                                                - location
                                                - media
                                                - transaction
                                                - meta
                                                - status
                                            properties:
                                                classifieds:
                                                    description: Classifieds currently associated with the property.
                                                    type: array
                                                    items:
                                                        $ref: "#/components/schemas/PropertyClassified"
                                                description:
                                                    description: Description of the property.
                                                    type: string
                                                    nullable: true
                                                energy:
                                                    description: Energy information for the classified.
                                                    $ref: "#/components/schemas/Energy"
                                                id:
                                                    type: string
                                                    format: uuid
                                                    example: 3a8f1d72-3d0b-4ee6-9a83-a7a9a73ae6c2
                                                location:
                                                    description: Location information.
                                                    $ref: "#/components/schemas/Location"
                                                media:
                                                    $ref: "#/components/schemas/Media"
                                                meta:
