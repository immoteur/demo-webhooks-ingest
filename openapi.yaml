            parameters:
                - name: id
                  in: path
                  description: Classified identifier (UUID).
                  required: true
                  schema:
                      type: string
                      format: uuid
                      example: 7f6e3b4d-9c22-46a0-8f20-0d1a2b3c4d5e
            responses:
                "200":
                    description: Classified matching the requested identifier.
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - classified
                                    - meta
                                properties:
                                    classified:
                                        $ref: "#/components/schemas/Classified"
                                    meta:
                                        type: object
                                        required:
                                            - subscriptionPlan
                                            - dataAccessLimit
                                        properties:
                                            dataAccessLimit:
                                                $ref: "#/components/schemas/DataAccessLimit"
                                            subscriptionPlan:
                                                $ref: "#/components/schemas/SubscriptionPlan"
                            example:
