    property-notification:
        post:
            tags:
                - Property
            parameters:
                - name: User-Agent
                  in: header
                  required: true
                  description: Identifies the request as an Immoteur webhook call.
                  schema:
                      type: string
                  example: ImmoteurWebhook/1
                - name: X-Immoteur-Service-Id
                  in: header
                  required: true
                  description: UUID of the Immoteur service emitting this webhook.
                  schema:
                      type: string
                      format: uuid
                  example: 2f9b734d-9c22-46a0-8f20-0d1a2b3c4d5e
                - name: X-Immoteur-Event-Id
                  in: header
                  required: true
                  description: Correlation ID for the webhook payload.
                  schema:
                      type: string
                      format: uuid
                  example: 11111111-2222-3333-4444-555555555555
                - name: X-Immoteur-Delivery-Id
                  in: header
                  required: true
                  description: Unique identifier for this HTTP delivery attempt.
                  schema:
                      type: string
                      format: uuid
                  example: 8f8f0c4e-1bca-48d5-98bb-8ab2c0c0ab12
                - name: X-Immoteur-Timestamp
                  in: header
                  required: true
                  description: Unix timestamp (seconds) for the delivery attempt.
                  schema:
                      type: string
                      pattern: "^[0-9]+$"
                  example: "1734278400"
