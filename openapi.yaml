    /classifieds/lookup:
        get:
            summary: Find a classified by URL
            description: |-
                Resolve the latest snapshot of a classified by providing the original listing URL. Tracking parameters (for example `utm_*`, `fbclid`, `gclid`) and fragment identifiers are ignored so you can safely reuse URLs copied from marketing campaigns.

                Provide the canonical classified URL when possible. When a scheme is missing the lookup defaults to `https`.
            operationId: classifiedsLookup
            tags:
                - Classified
            parameters:
                - name: url
                  in: query
                  required: true
                  description: Classified URL to resolve. Accepts incomplete URLs without a scheme; fragment identifiers and tracking parameters are ignored during lookup.
                  schema:
                      type: string
                      minLength: 3
                      maxLength: 2048
                  example: https://www.seloger.com/annonces/achat/appartement/paris-1er-75/5-pieces/0.htm?utm_source=newsletter&utm_medium=email#cta
