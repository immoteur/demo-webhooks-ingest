openapi: 3.1.0
info:
    title: Immoteur Public API
    version: 1.1.0
    description: |-
        Public API for the Immoteur service.

        ## Authentication
        Use a **Personal Access Token** from your Immoteur dashboard and send it in the `Authorization` header:

        ```
        Authorization: Bearer YOUR_TOKEN_HERE
        ```

        ### cURL example
        ```bash
        curl -sS https://api.immoteur.com/public/v1/auth \
          -H "Authorization: Bearer $IMMOTEUR_TOKEN"
        ```

        ## Environments
        - **Production:** `https://api.immoteur.com/public/v1`

        ## Errors & Rate Limiting
        - `400 Bad Request`: malformed request or invalid syntax.
        - `401 Unauthorized`: missing or invalid token.
        - `403 Forbidden`: token valid but not permitted for this resource.
        - `429 Too Many Requests`: back off and retry with exponential delay.
        - `422 Validation Error`: payload is syntactically correct but fails validation.

        ## Pagination
        - Requests specify `page` (1..500). Responses include `page`, `nextPage`, `perPage`, `total`, `totalPages`.

        ## Data Access Limits
        The `meta.dataAccessLimit` block shows **implicit filters** tied to your plan (e.g., whitelisted departments/SIREN/SIRET). Your effective result set equals **your filters ∩ requested filters**.

        ## Using AI/LLMs
        - Always include the `Authorization` header.
        - Prefer explicit filters (departments, INSEE, postcodes) with **existing** French codes/names.
        - Follow the examples below as canonical payload shapes.

        ## Contact & Docs
        - Website: https://immoteur.com
        - Support: Use your customer portal or contact listed on the website.
    contact:
        url: "https://immoteur.com"
        name: Immoteur
        email: support@immoteur.com
tags:
    - name: Info
      description: Token/account info
    - name: Property
      description: Property operations
    - name: Classified
      description: Classified operations
servers:
    - url: https://api.immoteur.com/public/v1
      description: Production server
externalDocs:
    description: Full product documentation
    url: https://docs.immoteur.com
security:
    - BearerAuth: []
paths:
    /auth:
        get:
            summary: Get Auth Info
            description: Returns the authenticated user's email and token information as a simple test endpoint.
            operationId: auth
            tags:
                - Info
            responses:
                "200":
                    description: Authenticated account and token information
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - email
                                    - tokenName
                                    - tokenCreatedAt
                                    - meta
                                properties:
                                    email:
                                        type: string
                                        format: email
                                        description: Email address of the authenticated account
                                        example: buyer@example.com
                                    meta:
                                        type: object
                                        required:
                                            - subscriptionPlan
                                            - dataAccessLimit
                                        properties:
                                            dataAccessLimit:
                                                $ref: "#/components/schemas/DataAccessLimit"
                                            subscriptionPlan:
                                                $ref: "#/components/schemas/SubscriptionPlan"
                                    tokenCreatedAt:
                                        type: string
                                        format: date-time
                                        description: Creation date of the token
                                        example: "2025-09-01T10:15:30Z"
                                    tokenName:
                                        type: string
                                        description: Name of the current auth token
                                        example: prod-ci-key-1
                            example:
                                email: buyer@example.com
                                tokenCreatedAt: "2025-09-01T10:15:30Z"
                                tokenName: prod-ci-key-1
                                meta:
                                    subscriptionPlan: pro200
                                    dataAccessLimit:
                                        departments: ["75", "92"]
                                        sirens: ["123456789"]
                                        sirets: ["12345678900011"]
                "400":
                    $ref: "#/components/responses/BadRequestError"
                "401":
                    $ref: "#/components/responses/UnauthorizedError"
                "403":
                    $ref: "#/components/responses/ForbiddenError"
                "404":
                    $ref: "#/components/responses/NotFoundError"
                "429":
                    $ref: "#/components/responses/RateLimitError"
                default:
                    $ref: "#/components/responses/DefaultError"

    /classifieds/{id}:
